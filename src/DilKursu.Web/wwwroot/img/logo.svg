  <!-- Dünya meridyen/paralel çizgileri (beyaz) -->
  <g stroke="#ffffff" stroke-width="3.5" fill="none" opacity="0.95">
    <ellipse cx="64" cy="64" rx="38" ry="15"/>
    <ellipse cx="64" cy="64" rx="15" ry="38"/>
    <line x1="26" y1="64" x2="102" y2="64"/>
